name: Tap CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install and test the tap formula
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          fi
          brew tap codexlin/tap "file://$GITHUB_WORKSPACE"
          brew install codexlin/tap/unoskills
          brew test codexlin/tap/unoskills
